<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#4F8177">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Whereabouts — item tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
</head>
<body>
<div id="app">

  <!-- ===== Checking session ===== -->
  <template v-if="authChecking">
    <div class="auth-screen">
      <div class="auth-card" style="text-align:center;">
        <div class="auth-brand" style="margin-bottom:6px;">
          <div class="brand"><template v-for="(word, i) in brandWordmark" :key="i"><span v-if="i">·</span>{{ word }}</template></div>
        </div>
        <div class="eyebrow">{{ t('Checking session…') }}</div>
      </div>
    </div>
  </template>

  <!-- ===== Auth screen ===== -->
  <template v-else-if="!currentUser">
    <div class="auth-screen">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand"><template v-for="(word, i) in brandWordmark" :key="i"><span v-if="i">·</span>{{ word }}</template></div>
          <div class="eyebrow">{{ t('Track where your things are') }}</div>
        </div>

        <div class="auth-error" v-if="authError">{{ authError }}</div>

        <form @submit.prevent="submitAuth">
          <div class="field">
            <label>{{ t('Username') }}</label>
            <input type="text" v-model="authForm.username" :placeholder="t('At least 3 characters')" autocomplete="username" minlength="3" required>
          </div>
          <div class="field">
            <label>{{ t('Password') }}</label>
            <input type="password" v-model="authForm.password" :placeholder="t('At least 4 characters')" autocomplete="current-password" required>
          </div>

          <button type="submit" class="btn btn-primary auth-submit" :disabled="authLoading">
            {{ authLoading ? t('Logging in…') : t('Log in') }}
          </button>
        </form>
      </div>
    </div>
  </template>

  <!-- ===== Main app ===== -->
  <template v-else>

  <!-- ===== Desktop sidebar (hidden on phones; see the min-width:900px block in styles.css) ===== -->
  <aside class="sidebar-nav">
    <div class="sidebar-brand"><template v-for="(word, i) in brandWordmark" :key="i"><span v-if="i">·</span>{{ word }}</template></div>

    <div class="search-wrap sidebar-search" v-if="tab==='items'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input mono" type="text" v-model="query" :placeholder="t('Search items…')">
    </div>

    <nav class="sidebar-links">
      <button :class="{active: tab==='items'}" @click="tab='items'">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        {{ t('Items') }}
      </button>
      <button :class="{active: tab==='locations'}" @click="tab='locations'">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        {{ t('Locations') }}
      </button>
      <button :class="{active: tab==='profile'}" @click="openProfile">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        {{ t('Profile') }}
      </button>
    </nav>

    <button class="sidebar-add-btn" @click="openAddItem" v-if="tab==='items'">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      {{ t('Add item') }}
    </button>
  </aside>

  <!-- ===== Scrolling content column (topbar + tab content); the sidebar
       stays fixed while this scrolls, see .content-col in the desktop
       media query ===== -->
  <div class="content-col">

  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand"><template v-for="(word, i) in brandWordmark" :key="i"><span v-if="i">·</span>{{ word }}</template></div>
    </div>
    <div class="search-wrap" v-if="tab==='items'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input mono" type="text" v-model="query" :placeholder="t('Search items…')">
    </div>
  </header>

  <!-- ===== Items tab ===== -->
  <template v-if="tab==='items'">
    <div class="chip-rail">
      <button class="chip" :class="{active: activeLocation===null}" @click="activeLocation=null">
        {{ t('All') }} <span class="count">{{ items.length }}</span>
      </button>
      <button class="chip" v-for="loc in locationFilterChips" :key="loc.id"
              :class="{active: activeLocation===loc.id, 'chip-ancestor': isAncestorOfActive(loc.id)}" @click="activeLocation=loc.id">
        <span class="chip-indent" v-if="loc.depth>0">{{ '›'.repeat(loc.depth) }}</span>
        <span class="loc-dot" :style="{width:'8px',height:'8px',background:loc.color}"></span>
        {{ loc.name }} <span class="count">{{ totalCountFor(loc.id) }}</span>
      </button>
    </div>

    <main>
      <div class="section-head">
        <span class="eyebrow">{{ filteredItems.length }} {{ plural(filteredItems.length, 'items') }}</span>
        <span class="eyebrow" v-if="query || activeLocation" style="cursor:pointer; opacity:.7" @click="query=''; activeLocation=null">{{ t('reset filter ✕') }}</span>
      </div>

      <div v-if="loadingItems" class="skeleton">
        <div class="sk-card" v-for="n in 4" :key="n"></div>
      </div>

      <div v-else-if="loadError && items.length===0" class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16.5" x2="12" y2="16.5"/></svg>
        <h3>{{ t('Backend unavailable') }}</h3>
        <p>{{ loadError }}</p>
        <button @click="loadData">{{ t('Try again') }}</button>
      </div>

      <div v-else-if="filteredItems.length===0" class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>
        <h3>{{ query || activeLocation ? t('Nothing found') : t('Nothing here yet') }}</h3>
        <p>{{ query || activeLocation ? t('Try changing the search query or location filter.') : t('Add your first item and remember where you put it.') }}</p>
        <button @click="openAddItem">{{ t('Add item') }}</button>
      </div>

      <div v-else class="item-list">
        <div class="item-card" v-for="it in filteredItems" :key="it.id" @click="openEditItem(it)">
          <div class="item-stub" :class="{'has-image': it.images && it.images.length}">
            <template v-if="it.images && it.images.length">
              <img :src="it.images[0]" @click.stop="openLightbox(it.images, 0)" alt="">
              <span class="image-count-badge" v-if="it.images.length > 1">+{{ it.images.length - 1 }}</span>
            </template>
            <div class="avatar" v-else :style="{background: locationOf(it.locationId).color}">{{ initials(it.name) }}</div>
          </div>
          <div class="item-body">
            <div class="item-name">{{ it.name }}</div>
            <div class="item-loc">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
              {{ locationPathString(it.locationId) }}
            </div>
            <div class="item-note" v-if="it.notes">{{ it.notes }}</div>
            <div class="item-meta">{{ t('Updated') }} {{ relativeTime(it.updatedAt) }}</div>
          </div>
          <div class="item-actions" @click.stop>
            <button @click="openEditItem(it)" :title="t('Edit')">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="del" @click="askDelete(it)" :title="t('Delete')">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </template>

  <!-- ===== Locations tab ===== -->
  <template v-else-if="tab==='locations'">
    <main>
      <div class="section-head">
        <span class="eyebrow">{{ t('Storage locations') }}</span>
      </div>

      <div class="loc-list">
        <div class="loc-row" v-for="node in locationTreeFlat" :key="node.loc.id"
             :class="{'is-nested': node.depth>0}"
             :style="{marginLeft: (node.depth*16)+'px'}">
          <button class="loc-toggle" :class="{collapsed: collapsed[node.loc.id]}"
                  v-if="node.hasChildren" @click="toggleCollapse(node.loc.id)" :title="t('Collapse/expand')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <span class="loc-toggle-spacer" v-else></span>
          <span class="loc-dot" :style="{background:node.loc.color}"></span>
          <span class="loc-name">{{ node.loc.name }}</span>
          <span class="loc-count">{{ totalCountFor(node.loc.id) }} {{ locale==='ru' ? 'вещ.' : plural(totalCountFor(node.loc.id), 'items') }}</span>
          <div class="loc-row-actions">
            <button class="icon-btn" @click="startSubLocation(node.loc)" :title="t('Add nested location')">
              <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <button class="icon-btn" @click="openEditLocation(node.loc)" :title="t('Edit location')">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="icon-btn del" @click="askDeleteLocation(node.loc)" :title="t('Delete location')">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="section-head"><span class="eyebrow">{{ t('New location') }}</span></div>

      <div class="parent-hint" v-if="newLocationParentId">
        {{ t('Inside:') }} {{ locationPathString(newLocationParentId) }}
        <button @click="newLocationParentId=null">{{ t('remove ✕') }}</button>
      </div>

      <div class="field" style="margin-top:10px; margin-bottom:8px;">
        <label>{{ t('Parent location') }}</label>
        <select v-model="newLocationParentId">
          <option :value="null">{{ t('— No parent (top level) —') }}</option>
          <option v-for="loc in locationOptionsFlat" :key="loc.id" :value="loc.id">
            {{ '—'.repeat(loc.depth) }}{{ loc.depth>0 ? ' ' : '' }}{{ loc.name }}
          </option>
        </select>
      </div>

      <div class="add-loc-form">
        <input type="text" v-model="newLocationName" :placeholder="t('e.g. Shelf 2')" ref="newLocationInput" @keyup.enter="createLocation">
        <button @click="createLocation" :disabled="!newLocationName.trim()">{{ t('Add') }}</button>
      </div>
      <div class="swatches">
        <div class="swatch" v-for="c in palette" :key="c"
             :style="{background:c}" :class="{active: newLocationColor===c}"
             @click="newLocationColor=c"></div>
      </div>
    </main>
  </template>

  <!-- ===== Profile tab ===== -->
  <template v-else-if="tab==='profile'">
    <main>
      <div class="section-head"><span class="eyebrow">{{ t('Profile') }}</span></div>

      <div class="profile-page">
        <div class="profile-cards">
          <div class="profile-card">
            <h3>{{ t('Interface language') }}</h3>
            <select class="lang-select" :value="locale" @change="setLanguage($event.target.value)">
              <option value="ru">Русский</option>
              <option value="en">English</option>
              <option value="de">Deutsch</option>
              <option value="es">Español</option>
              <option value="fr">Français</option>
            </select>
          </div>

          <div class="profile-card">
            <h3>{{ t('Location nesting depth in filters') }}</h3>
            <p class="field-hint">{{ t('How many levels of nested locations to show as filter chips on the Items tab. Leave empty to show all levels.') }}</p>
            <input class="lang-select depth-input" type="number" min="1" step="1" :placeholder="t('All')"
                   :value="currentUser.locationFilterDepth || ''" @change="setLocationFilterDepth($event)">
          </div>

          <div class="profile-card">
            <h3>{{ t('Change username') }}</h3>
            <div class="field-error field-error-top" v-if="usernameFormError">{{ usernameFormError }}</div>
            <form @submit.prevent="submitUsernameChange">
              <div class="field">
                <label>{{ t('Username') }}</label>
                <input type="text" v-model="usernameForm.username" autocomplete="username" minlength="3" required>
              </div>
              <div class="field">
                <label>{{ t('Current password') }}</label>
                <input type="password" v-model="usernameForm.currentPassword" autocomplete="current-password" required>
              </div>
              <button class="btn btn-primary auth-submit" type="submit" :disabled="usernameFormSaving">
                {{ usernameFormSaving ? t('Saving…') : t('Save') }}
              </button>
            </form>
          </div>

          <div class="profile-card">
            <h3>{{ t('Change password') }}</h3>
            <div class="field-error field-error-top" v-if="passwordFormError">{{ passwordFormError }}</div>
            <form @submit.prevent="submitPasswordChange">
              <div class="field">
                <label>{{ t('Current password') }}</label>
                <input type="password" v-model="passwordForm.currentPassword" autocomplete="current-password" required>
              </div>
              <div class="field">
                <label>{{ t('New password') }}</label>
                <input type="password" v-model="passwordForm.newPassword" :placeholder="t('At least 4 characters')" autocomplete="new-password" required>
              </div>
              <div class="field">
                <label>{{ t('Confirm new password') }}</label>
                <input type="password" v-model="passwordForm.confirmPassword" autocomplete="new-password" required>
              </div>
              <button class="btn btn-primary auth-submit" type="submit" :disabled="passwordFormSaving">
                {{ passwordFormSaving ? t('Saving…') : t('Save') }}
              </button>
            </form>
          </div>
        </div>

        <button class="btn-logout" @click="logout">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          {{ t('Log out') }}
        </button>
      </div>
    </main>
  </template>

  </div>

  <!-- ===== FAB ===== -->
  <button class="fab" @click="openAddItem" v-if="tab==='items'">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <!-- ===== Bottom nav ===== -->
  <nav class="bottom-nav">
    <button class="nav-btn" :class="{active: tab==='items'}" @click="tab='items'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      {{ t('Items') }}
    </button>
    <button class="nav-btn" :class="{active: tab==='locations'}" @click="tab='locations'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      {{ t('Locations') }}
    </button>
    <button class="nav-btn" :class="{active: tab==='profile'}" @click="openProfile">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      {{ t('Profile') }}
    </button>
  </nav>

  <!-- ===== Add / edit item sheet ===== -->
  <Transition name="sheet">
    <div class="overlay" v-if="showItemSheet" @click.self="closeItemSheet">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <h2>{{ editingId ? t('Edit item') : t('New item') }}</h2>
          <button @click="closeItemSheet">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="field">
          <label>{{ t('Item name') }}</label>
          <input type="text" v-model="form.name" :placeholder="t('e.g. Passport')" ref="nameInput">
          <div class="field-error" v-if="formErrors.name">{{ formErrors.name }}</div>
        </div>

        <div class="field">
          <label>{{ t('Location') }}</label>
          <select v-model="form.locationId">
            <option :value="null" disabled>{{ t('Select a location') }}</option>
            <option v-for="loc in locationOptionsFlat" :key="loc.id" :value="loc.id">
              {{ '—'.repeat(loc.depth) }}{{ loc.depth>0 ? ' ' : '' }}{{ loc.name }}
            </option>
          </select>
          <div class="field-error" v-if="formErrors.locationId">{{ formErrors.locationId }}</div>
        </div>

        <div class="field">
          <label>{{ t('Note (optional)') }}</label>
          <textarea v-model="form.notes" rows="2" :placeholder="t('e.g. top drawer, under documents')"></textarea>
        </div>

        <div class="field">
          <label>{{ t('Photos (optional)') }}</label>
          <div class="image-grid">
            <div class="image-thumb" v-for="(img, idx) in form.images" :key="idx">
              <img :src="img" @click="openLightbox(form.images, idx)" alt="">
              <button class="remove-img" @click="removeFormImage(idx)" :title="t('Remove photo')">
                <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
            <label class="image-add-btn" :class="{uploading: uploadingImages}">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
              <input type="file" accept="image/*" multiple style="display:none" @change="onFilesSelected" :disabled="uploadingImages">
            </label>
          </div>
        </div>

        <div class="sheet-actions">
          <button class="btn btn-ghost" @click="closeItemSheet">{{ t('Cancel') }}</button>
          <button class="btn btn-primary" @click="saveItem" :disabled="saving">
            {{ saving ? t('Saving…') : t('Save') }}
          </button>
        </div>
      </div>
    </div>
  </Transition>

  <!-- ===== Delete item confirm ===== -->
  <Transition name="sheet">
    <div class="overlay" v-if="deleteTarget" @click.self="deleteTarget=null">
      <div class="confirm-box">
        <h3>{{ t('Delete "{name}"?', {name: deleteTarget.name}) }}</h3>
        <p>{{ t("This item's location record will be permanently deleted.") }}</p>
        <div class="confirm-actions">
          <button class="btn btn-ghost" @click="deleteTarget=null">{{ t('Cancel') }}</button>
          <button class="btn btn-danger" @click="confirmDeleteItem">{{ t('Delete') }}</button>
        </div>
      </div>
    </div>
  </Transition>

  <!-- ===== Delete location confirm ===== -->
  <Transition name="sheet">
    <div class="overlay" v-if="deleteLocationTarget" @click.self="deleteLocationTarget=null">
      <div class="confirm-box">
        <h3>{{ t('Delete location "{name}"?', {name: deleteLocationTarget.name}) }}</h3>
        <p v-if="hasChildLocations(deleteLocationTarget.id)">
          {{ t('It contains nested locations. Delete or move them first.') }}
        </p>
        <p v-else-if="directCountFor(deleteLocationTarget.id) > 0">
          {{ t('This location holds {n} {word}. Move them to another location first.', {n: directCountFor(deleteLocationTarget.id), word: plural(directCountFor(deleteLocationTarget.id), 'items')}) }}
        </p>
        <p v-else>{{ t('This storage location will be deleted.') }}</p>
        <div class="confirm-actions">
          <button class="btn btn-ghost" @click="deleteLocationTarget=null">{{ t('Cancel') }}</button>
          <button class="btn btn-danger" @click="confirmDeleteLocation"
                  :disabled="hasChildLocations(deleteLocationTarget.id) || directCountFor(deleteLocationTarget.id) > 0">{{ t('Delete') }}</button>
        </div>
      </div>
    </div>
  </Transition>

  <!-- ===== Edit location ===== -->
  <Transition name="sheet">
    <div class="overlay" v-if="editLocationTarget" @click.self="closeEditLocation">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <h2>{{ t('Edit location') }}</h2>
          <button @click="closeEditLocation">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="field">
          <label>{{ t('Location name') }}</label>
          <input type="text" v-model="editLocationForm.name" :placeholder="t('e.g. Shelf 2')" @keyup.enter="saveLocationEdit">
        </div>

        <div class="swatches">
          <div class="swatch" v-for="c in palette" :key="c"
               :style="{background:c}" :class="{active: editLocationForm.color===c}"
               @click="editLocationForm.color=c"></div>
        </div>

        <div class="sheet-actions">
          <button class="btn btn-ghost" @click="closeEditLocation">{{ t('Cancel') }}</button>
          <button class="btn btn-primary" @click="saveLocationEdit" :disabled="!editLocationForm.name.trim() || editLocationSaving">
            {{ editLocationSaving ? t('Saving…') : t('Save') }}
          </button>
        </div>
      </div>
    </div>
  </Transition>

  <!-- ===== Lightbox ===== -->
  <Transition name="toast">
    <div class="lightbox-overlay" v-if="lightbox.open" @click.self="closeLightbox">
      <button class="lightbox-close" @click="closeLightbox">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <button class="lightbox-nav lightbox-prev" v-if="lightbox.images.length > 1" @click="lightboxStep(-1)">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <img :src="lightbox.images[lightbox.index]" alt="">
      <button class="lightbox-nav lightbox-next" v-if="lightbox.images.length > 1" @click="lightboxStep(1)">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="lightbox-counter" v-if="lightbox.images.length > 1">{{ lightbox.index + 1 }} / {{ lightbox.images.length }}</div>
    </div>
  </Transition>

  <!-- ===== Toast ===== -->
  <Transition name="toast">
    <div class="toast" v-if="toastMessage">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      {{ toastMessage }}
    </div>
  </Transition>

  </template>
</div>

<script src="i18n.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
